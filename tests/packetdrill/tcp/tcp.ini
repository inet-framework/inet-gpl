# What the TCP scripts need beyond ini/base.ini: the Linux behaviors that no sysctl of a
# script's preamble states, as INET parameters. What a preamble does state -- SACK, window
# scaling, timestamps, Fast Open, the Fast Open key, the window scale from tcp_rmem -- reaches
# INET per script from scripts.yaml's defaults block through sysctls.yaml, and a key set that
# way on the command line always beats this file, so none of those is repeated here.

[General]
**.pdhost.numTcpTunApps = 1

**.tcp.mss = 1460
# STRICT cookie validation (real keyed-hash check): Linux rejects a cookie that
# does not match its per-server secret -- reset-non-tfo-socket sends a
# deliberately WRONG cookie and expects the data to be dropped (ack 1, fresh
# cookie offered), which lenient mode wrongly accepted (ack len+1). The key
# comes from the preamble's tcp_fastopen_key, so the symbolic TFO_COOKIE
# literal validates and valid-cookie scripts keep passing.
**.tcp.fastopenLenientCookieValidation = false
# AccECN (Linux parity): Linux emits the AccECN option on every ACK-bearing
# segment (not INET's every-4th default) and always uses kind 174 (E1B,CEB,E0B
# order) rather than alternating 172/174. Both are inert unless AccECN is
# negotiated. INET's own defaults (beacon=4, alternate=true) stay for module tests.
**.tcp.accEcnOptionEnabled = true
**.tcp.accEcnOptionBeaconAcks = 1
**.tcp.accEcnOptionKindAlternates = false
**.tcp.advertisedWindow = 29200
# Linux always sets PSH on the last segment of a write; INET gates this behind
# a default-off param (pending a maintainer default flip). Enable it here so
# the INET run is measured as "INET configured to behave like Linux."
**.tcp.pushSegmentsOnWriteBoundary = true

# Linux uses "quick ACK" mode after connection setup (and in slow start),
# sending ACKs immediately rather than delaying them; the scripts' scripts are
# short enough to sit entirely in that immediate-ACK regime, so they assert an
# ACK right after each received segment. INET's RFC-1122 delayed-ACK (200 ms)
# never matches that "immediate" timing. Disable delayed ACK here as the closest
# faithful approximation of Linux's quick-ACK behavior for the scripts (a full
# quick-ACK state machine is not modeled in INET). Verified net +5 MATCH with
# zero regressions across the whole suite.
# Linux runs delayed ACKs with quickack/ATO/pingpong dynamics; INET's
# adaptiveDelayedAcks models exactly that (the bare fixed-200ms delack
# measured WORSE suite-wide: MATCH 187 -> 173 on 2026-07-17).
**.tcp.delayedAcksEnabled = true
**.tcp.adaptiveDelayedAcks = true

# Tail Loss Probe: Linux ships tcp_early_retrans=3 (TLP+ER enabled) by default,
# and the scripts' tail-loss scripts expect the ~2*SRTT probe of the last
# segment instead of a full RTO. INET's tlpEnabled default stays off.
**.tcp.tlpEnabled = true
# Linux seeds srtt/rttvar/RTO from the SYN<->SYN-ACK exchange, so its
# first-flight RTO and TLP probe timeout are RTT-scaled from the start.
**.tcp.seedRttFromHandshake = true

# Linux REO-timeout arming is jiffy-quantized (usecs_to_jiffies+1); the kernel of
# linux-results.csv runs HZ=250 (the eor/no-coalesce-retrans +4~8ms retransmit window and
# prr-ss-30pkt-lost-1_4-11_16 dupthresh-timed recovery entry both pin it)
**.tcp.rackReoTimerGranularity = 4ms

# Linux receiver-window auto-tuning (tcp_grow_window): the offered window grows
# with received data toward the rcvbuf-derived clamp (ooo-before-and-after-accept
# needs the promise to reach the second 60000B OOO injection)
**.tcp.windowAutoTuning = true
