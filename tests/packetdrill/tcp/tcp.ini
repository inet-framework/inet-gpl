# What the TCP scripts need beyond ini/base.ini. The TCP module of the host is LinuxTcp, which
# has the defaults of Linux 7.1 with its stock sysctls; INET's Tcp has the defaults of the RFCs.
# What a preamble states -- SACK, window scaling, timestamps, Fast Open, the Fast Open key, the
# window scale from tcp_rmem -- reaches INET per script from scripts.yaml's defaults block
# through sysctls.yaml, and a key set that way on the command line always beats this file, so
# none of those is repeated here. What remains below is what the scripts set apart from stock
# Linux. The MSS is the default of INET (mss = -1): 1460 bytes for IPv4 and 1440 bytes for IPv6,
# as Linux gives for an MTU of 1500 bytes.

[General]
**.pdhost.numTcpTunApps = 1
**.pdhost.tcp.typename = "LinuxTcp"

# The receive window that the scripts expect in the SYN and the first segments.
**.tcp.advertisedWindow = 29200
