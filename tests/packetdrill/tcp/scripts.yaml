# The TCP scripts: the upstream commit each script set was copied from, the defaults every
# script runs under, the environment of the Linux run, the skips and the kernel drift.
# Re-pin (and re-record linux-results.csv) whenever any of these move.
#
# The scripts are copied into this repository, under tests/protocol/tcp/ (see README.md in
# this folder for provenance and how to refresh them), so the suite runs from a bare
# checkout with nothing to clone. git_commit/pinned_date record the upstream commit.
#
# `path` is resolved by suite.py: environment variables and `~` are expanded, then a
# relative path is taken relative to INETGPL_ROOT (the repository root). To run against an
# external clone instead, point `path` at it (absolute, or via a variable) and set `subdir`
# to the directory holding the .pkt files.
#
# `title` names the set in the README that gen-wrappers writes beside the INET wrappers of the set.

script_sets:
  linux:
    title: the Linux kernel's selftests
    path: tests/protocol/tcp/linux
    upstream_url: https://github.com/torvalds/linux.git
    upstream_path: tools/testing/selftests/net/packetdrill
    subdir: ""
    git_commit: d96fcfe1b7f94ac742984ae7986b94a116abff1b
    pinned_date: "2026-07-10"
    # The files the scripts call by relative path on Linux, placed around a copy of the
    # scripts when the Linux run runs them (stage_scripts); sources are relative to this folder.
    helpers:
      defaults.sh: defaults          # written from the defaults block below
      set_sysctls.py: set_sysctls.py
  packetdrill:
    title: the packetdrill repository
    path: tests/protocol/tcp/packetdrill
    upstream_url: https://github.com/google/packetdrill.git
    upstream_path: gtests/net/tcp
    subdir: ""
    git_commit: 2c4001c4d6fc04a3bbd01d4b92be62717a37648a
    pinned_date: "2026-03-11"
    helpers:
      common/defaults.sh: defaults
      common/set_sysctls.py: set_sysctls.py
      ../common/defaults.sh: defaults


# What every script's preamble sets up on Linux: upstream's defaults.sh, as data. All 321 scripts
# source a defaults.sh by relative path. The Linux run writes one per set from this block into the copy
# of the scripts it runs (the `defaults` helper); the INET run takes the same sysctls for the script's
# set and translates them through sysctls.yaml. Upstream's two files differ only in `sets`.
# A re-pin reads upstream's defaults.sh at the old and the new commit and applies the change here:
#   linux:       tools/testing/selftests/net/packetdrill/defaults.sh
#   packetdrill: gtests/net/tcp/common/defaults.sh (and its identical gtests/net/common/defaults.sh)
defaults:
  commands:
    - ip tcp_metrics flush all > /dev/null 2>&1
    - tc qdisc add dev tun0 root pfifo
  sysctls:                                      # the 21 settings both sets share
    net.ipv4.tcp_rmem: "4096 540000 15728640"
    net.ipv4.tcp_wmem: "4096 262144 4194304"
    net.ipv4.tcp_timestamps: "1"
    net.ipv4.tcp_syn_retries: "5"
    net.ipv4.tcp_synack_retries: "5"
    net.ipv4.tcp_frto: "2"
    net.ipv4.tcp_sack: "1"
    net.ipv4.tcp_dsack: "1"
    net.ipv4.tcp_fack: "0"
    net.ipv4.tcp_reordering: "3"
    net.ipv4.tcp_congestion_control: "cubic"
    net.ipv4.tcp_slow_start_after_idle: "0"
    net.ipv4.tcp_early_retrans: "4"
    net.ipv4.tcp_recovery: "1"
    net.ipv4.tcp_tso_win_divisor: "3"
    net.ipv4.tcp_ecn: "0"
    net.ipv4.tcp_pacing_ss_ratio: "200"
    net.ipv4.tcp_pacing_ca_ratio: "120"
    net.ipv4.tcp_notsent_lowat: "4294967295"
    net.ipv4.tcp_fastopen_key: "a1a1a1a1-b2b2b2b2-c3c3c3c3-d4d4d4d4"
    net.ipv4.tcp_syncookies: "1"
  sets:                                         # where the two upstream files differ
    linux:
      net.ipv4.tcp_fastopen: "0x3"
    packetdrill:
      net.ipv4.tcp_ecn_option: "2"
      net.ipv4.tcp_fastopen: "0x70403"
  # Linux's own defaults that no preamble sets, but that the INET run must mirror: INET's defaults
  # differ. Not written into defaults.sh -- the kernel has them already.
  kernel:
    net.ipv4.tcp_window_scaling: "1"

environment:
  # Looked up on PATH; suite.py records the resolved location in the report.
  # An absolute path here is honoured as-is (it has no --version, so the path
  # is the only fingerprint available).
  packetdrill_binary: packetdrill
  # The upstream packetdrill commit that binary was built from. packetdrill has no --version,
  # so the Linux run writes this value into linux-results.csv's header as the provenance of its run.
  packetdrill_commit: ""
  # Optional, resolved like the script paths above: a local kernel checkout
  # used only to prefix the report's "kernel source hint" for a diverging
  # script. Leave empty to emit bare kernel-tree-relative paths.
  kernel_source_root: ""

# The scripts that the suite does not run, with the reason, keyed by the script's id: its path
# below tests/protocol.
skips:
  # The suite uses IPv4 only, the same as the addresses of the INET run. These
  # two scripts set --ip_version=ipv6 themselves, and the fixed IPv4 flags in
  # suite.py do not let them run. This is a limit of the suite, not a kernel
  # or INET bug.
  tcp/linux/tcp_syncookies_ip6_9k: "forces --ip_version=ipv6, out of IPv4-only scope"
  tcp/packetdrill/mtu_probe/basic-v6: "forces --ip_version=ipv6, out of IPv4-only scope"
  tcp/packetdrill/fastopen/client/syn-data-icmp-unreach-frag-needed-with-seq-ipv6: "uses ICMPv6 'packet_too_big', out of IPv4-only scope (icmp_type_from_word only maps ICMPv4 'unreachable'); was masquerading as INET_DIVERGE via semantic_error()'s generic 'Script error', not a real behavioral divergence"

# Scripts whose Linux-run failure is the KERNEL disagreeing with the script, not the
# harness failing to run it: the Linux run executes correctly and Linux (see
# the kernel of linux-results.csv) simply does not behave the way the script pins.
# These are reported as KERNEL_DRIFT and excluded from MATCH/DIVERGENCE, exactly
# like LINUX_SUSPECT -- the split exists so that LINUX_SUSPECT means "not
# explained yet, go look", which is actionable, instead of a standing backlog.
#
# Every entry below was diagnosed individually on 2026-07-28. None is
# recoverable from our side: none depends on a
# sysctl missing from this kernel, their set_sysctls.py writes were verified to
# land, ethtool is installed, per-script options are no longer overridden, and
# privileged mode is available. They are NOT "Google-kernel-only features" --
# every one tests generic upstream behavior, one of them (the ms-timestamps
# reproducer) an upstream commit by name.
#
# Re-check after a kernel upgrade or a re-pin of the scripts: `compare` prints a loud
# note for any entry here whose the Linux run has started passing again.
kernel_drift:
  tcp/packetdrill/gro/gro-mss-option: "the injected data segment carries the ACK flag but no `ack N` field, so packetdrill sends ack_seq=0, remapped to the server's ISN (snd_una-1); this kernel drops a data segment bearing that stale ACK, so nothing is ever received and it ACKs 1 instead of 10001. Adding `ack 1` makes the script pass -- but that means editing a copied upstream script, which would break the sha256 check of linux-results.csv. The only script with this pattern."
  tcp/packetdrill/ts_recent/invalid_ack: "same family as gro-mss-option: the script expects a segment with an out-of-window ACK to still update ts_recent/advance the connection; this kernel rejects it, so the reply acks 1 rather than 1001"
  tcp/packetdrill/epoll/epoll_out_edge: "expects a 16000-byte outbound burst, the kernel emits 20000 in one skb. The data QUEUED is right -- forcing tun offloads off yields exactly 16000 -- but then the PSH bit differs, so this is kernel packetization, not sndbuf accounting. tcp_wmem='4096 50000 4194304' was verified to land inside the netns."
  tcp/packetdrill/epoll/epoll_out_edge_notsent_lowat: "as epoll/epoll_out_edge (16000 expected vs 20000 emitted)"
  tcp/packetdrill/epoll/epoll_out_edge_default_notsent_lowat: "as epoll/epoll_out_edge (16000 expected vs 20000 emitted)"
  tcp/packetdrill/notsent_lowat/notsent-lowat-default: "as epoll/epoll_out_edge (16000 expected vs 20000 emitted)"
  tcp/packetdrill/cubic/cubic-bulk-166k: "CUBIC slow start reaches cwnd 36 where the script asserts 40: Linux only grows cwnd while the sender is cwnd-limited, and under fq pacing at 166 kbit/s it is pacing-limited for part of the run. Script and kernel disagree about the growth schedule, not about CUBIC."
  tcp/packetdrill/cubic/cubic-bulk-166k-idle-restart: "as cubic/cubic-bulk-166k (cwnd 36 vs the asserted 40)"
  tcp/packetdrill/cwnd_moderation/cwnd-moderation-ecn-enter-cwr-no-moderation-700: "asserts tcpi_snd_cwnd == 4 after ECN-triggered CWR; this kernel keeps 5"
  tcp/packetdrill/shutdown/shutdown-rdwr-write-queue-close: "expects no payload on the segment after shutdown(SHUT_RDWR) with unacknowledged data queued; this kernel still sends 1000 bytes"
  tcp/packetdrill/zerocopy/maxfrags: "'tcp_MAX_SKB_FRAGS test' -- the split into 17 frags + 1 is correct here (CONFIG_MAX_SKB_FRAGS=17 matches what the script assumes), but the final 1-byte segment's payload content differs. Not a build-config mismatch."
  tcp/packetdrill/fastopen/server/client-ack-dropped-then-recovery-ms-timestamps: "reproducer for upstream 794200d66273 ('tcp: undo cwnd on Fast Open spurious SYNACK retransmit'); the advertised window comes back 1053 where the script pins 256"
