# The configuration of every INET run, whatever the protocol: the network, the host with its
# tun interface and PacketDrillApp, the capture, the timing tolerance. What a protocol's scripts
# need beyond this is in <protocol>/<protocol>.ini, loaded after this file; a key belongs to one
# of the two files only, because OMNeT++ takes the first match.

[General]
network = PacketDrillNetwork
debug-on-errors = false
cmdenv-express-mode = false
cmdenv-redirect-output = false

**.pdhost.tunApp[0].typename = "PacketDrillApp"
**.pdhost.numTunInterfaces = 1
**.hasTun = true

**.startTime = 1s

# NOTE: "**.pdhost.routingTable.X" (the pattern the 2015-era legacy tests use)
# does NOT match the actual module path (pdhost.ipv4.routingTable -- Ipv4RoutingTable
# is nested one level deeper under "ipv4" in current INET) and silently never
# loads the routing file. Use "**.routingTable.X" so "**" absorbs the "ipv4" hop.
**.routingTable.routingFile = "ned/pdhost.mrt"
**.pdhost.tunApp[0].localPort = 1000
**.pdhost.tunApp[0].remotePort = 2000
**.pdhost.tunApp[0].localAddress = "192.168.0.1"
# The scripted peer's address must equal the Linux run's (tcp/tcp.py's LINUX_FLAGS,
# remote 192.0.2.1): the TFO cookie is SipHash(saddr||daddr), so a different
# peer address makes every deterministic-cookie assertion (TFO_COOKIE and the
# simple1-3 literals) unmatchable.
**.pdhost.tunApp[0].remoteAddress = "192.0.2.1"

# Debugging aid: record INET's actually-emitted packets on the tun interface.
# Verdicts come from PacketDrillApp's own comparator via its "Packetdrill
# error:" output, classified in suite.py's classify_inet_output(); the recording
# is kept for post-mortem wire inspection. suite.py gives each run its own file
# under out/pcap/ and creates the directory first: PcapRecorder opens the file
# eagerly in initialize() and aborts the run if the directory is missing.
**.pdhost.numPcapRecorders = 1
**.pdhost.pcapRecorder[0].pcapFile = "out/pcap/_unset.pcap"
**.pdhost.pcapRecorder[0].moduleNamePatterns = "tun[0]"
**.pdhost.pcapRecorder[0].sendingSignalNames = "packetSentToUpper"
**.pdhost.pcapRecorder[0].receivingSignalNames = "packetReceivedFromUpper"
**.pdhost.pcapRecorder[0].alwaysFlush = true

# Timing tolerance for the INET run: the scripts were written against real-kernel
# timing (RTOs, delayed ACKs...); INET's own timers won't line up to the
# microsecond. This is deliberately generous at framework bring-up -- a
# DIVERGENCE whose message starts with "Packet arrived at the wrong time" at
# this tolerance is a genuine timing gap worth narrowing later, not noise.
**.pdhost.tunApp[0].latency = 0.5s
